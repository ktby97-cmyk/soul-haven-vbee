<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f4ecdc">
<title>Soul Haven</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap">
<style>
:root{
  --bg:#f4ecdc;--paper:#fbf6ea;--ink:#2b2622;--ink-soft:#6d6357;--line:#d8cdb8;
  --accent:#9c6b3f;--warm:#f1e3c8;--gold:#eec060;--sage:#6f8a62;--night:#1d2a4a;--rose:#c98a86;--danger:#a05040;
  --serif:'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:17px;-webkit-text-size-adjust:100%}
body{font-family:var(--serif);color:var(--ink);line-height:1.7;min-height:100vh;padding:1.6rem 1rem 5rem;
  background-color:var(--bg);background-image:radial-gradient(ellipse at 20% 0%,#fbf3df 0,transparent 55%),radial-gradient(ellipse at 90% 100%,#ecdcc0 0,transparent 50%);background-attachment:fixed;}
html{background:var(--bg);color-scheme:light}
.container{max-width:720px;margin:0 auto}.container.wide{max-width:1100px}
h1{font-size:2rem;font-weight:400;letter-spacing:.03em;font-style:italic;margin-bottom:.2rem}
h2{font-size:1.45rem;font-weight:400;margin-bottom:.1rem}
h4{font-weight:400}
.subtitle{font-size:.75rem;color:var(--ink-soft);letter-spacing:.14em;text-transform:uppercase;margin-bottom:1rem}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.back{display:inline-block;color:var(--ink-soft);font-size:.9rem;margin-bottom:.9rem;cursor:pointer;background:none;border:none;padding:.3rem 0;font-family:inherit}
.back:hover{color:var(--ink)}
.muted{color:var(--ink-soft);font-style:italic}
.small{font-size:.82rem}
.err{color:var(--danger);font-size:.85rem;margin:-.3rem 0 .6rem;font-style:italic}

/* ---------- scenes ---------- */
.scene{width:100%;margin:0 0 1.6rem;border-radius:6px;overflow:hidden;background:#1a2230;position:relative;
  box-shadow:0 1px 0 #fff8 inset,0 6px 26px rgba(60,40,20,.2);border:1px solid #8a6e4a}
.scene::after{content:"";position:absolute;inset:5px;border:1px solid rgba(255,244,216,.35);border-radius:3px;pointer-events:none}
.scene svg{display:block;width:100%;height:auto}
.world{border-radius:10px;margin-bottom:1.1rem}

@keyframes twinkle{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes flicker{0%,100%{opacity:1}50%{opacity:.55}}
@keyframes drift{0%{transform:translateY(0) scale(1);opacity:.65}100%{transform:translateY(-50px) scale(.6);opacity:0}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes firefly{0%{opacity:0;transform:translate(0,0)}30%{opacity:1}70%{opacity:.8;transform:translate(6px,-14px)}100%{opacity:0;transform:translate(-3px,-26px)}}
@keyframes sway{0%,100%{transform:rotate(0)}50%{transform:rotate(2.5deg)}}
@keyframes spin-slow{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes ray-pulse{0%,100%{opacity:.35}50%{opacity:.7}}
@keyframes cloudMove{0%,100%{transform:translateX(0)}50%{transform:translateX(26px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes fall{0%{transform:translate(0,0) rotate(0);opacity:1}80%{opacity:1}100%{transform:translate(40px,150px) rotate(360deg);opacity:0}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes fadeIn{to{opacity:1}}
.twinkle{animation:twinkle 3.2s ease-in-out infinite}
.flicker{animation:flicker 2.4s ease-in-out infinite}
.drift{animation:drift 7s ease-out infinite}
.breathe,.flicker,.sway,.bob,.spin-slow,.cloud,.blink{transform-box:fill-box;transform-origin:center}
.breathe{animation:breathe 4.5s ease-in-out infinite}
.firefly{animation:firefly 6s ease-in-out infinite}
.sway{animation:sway 5s ease-in-out infinite;transform-origin:bottom center}
.spin-slow{animation:spin-slow 50s linear infinite}
.ray-pulse{animation:ray-pulse 5s ease-in-out infinite}
.cloud{animation:cloudMove 40s ease-in-out infinite}
.bob{animation:bob 4s ease-in-out infinite}
.blink{animation:blink 6s infinite}
.falling{animation:fall 2.4s ease-in forwards}

/* ---------- world map · Luxury Enchanted Fantasy ---------- */
.scene.world{background:#1f86e0;border:1px solid #d9b45a;box-shadow:0 12px 36px rgba(30,40,110,.35),0 1px 0 #fff8 inset;overflow-x:auto;overflow-y:hidden}
.scene.world::after{display:none}
@keyframes flow{to{stroke-dashoffset:-48}}
@keyframes dust{0%{opacity:0;transform:translate(0,0)}25%{opacity:.9}100%{opacity:0;transform:translate(14px,-70px)}}
@keyframes tsway{0%,100%{transform:rotate(-.9deg)}50%{transform:rotate(.9deg)}}
.flow{animation:flow 5s linear infinite}
.dust{animation:dust 9s ease-in-out infinite}
.tsway{animation:tsway 8s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.loc{cursor:pointer;outline:none}
.loc .lift{transition:transform .35s cubic-bezier(.3,1.5,.5,1),filter .35s;transform-box:fill-box;transform-origin:50% 100%}
.loc .halo{opacity:0;transition:opacity .35s}
.loc .spark{opacity:0;transition:opacity .35s}
.loc .spark .twinkle{animation-play-state:paused}
.loc .tag .pl{fill:url(#gTag);stroke:#c9a24e;stroke-width:1.6;transition:stroke .25s;filter:drop-shadow(0 3px 4px rgba(10,20,70,.45))}
.loc .tag .in{fill:none;stroke:#d9b45a;stroke-width:.8;opacity:.6}
.loc .tag text{font-family:var(--serif);font-size:22px;font-weight:600;fill:#2f2142;text-anchor:middle}
.loc:hover .lift,.loc:focus-visible .lift{transform:translateY(-6px) scale(1.05);filter:drop-shadow(0 0 10px rgba(255,220,120,.95)) brightness(1.07)}
.loc:hover .halo,.loc:focus-visible .halo,.loc:hover .spark,.loc:focus-visible .spark{opacity:1}
.loc:hover .spark .twinkle,.loc:focus-visible .spark .twinkle{animation-play-state:running}
.loc:hover .tag .pl,.loc:focus-visible .tag .pl{fill:url(#gTagH);stroke:#e0a83a}
.loc:active .lift{transform:translateY(0) scale(.97)}.loc.wm-pick .lift{transform:translateY(-6px) scale(1.05);filter:drop-shadow(0 0 10px rgba(255,220,120,.95)) brightness(1.07)}
.loc:focus-visible .tag .pl{stroke-width:2.8}
@media(max-width:700px){.scene.world svg{min-width:700px}}
@media(prefers-reduced-motion:reduce){.world *{animation:none!important}}
.planet{cursor:pointer;outline:none}
.planet .pl{transition:transform .35s cubic-bezier(.3,1.5,.5,1);transform-box:fill-box;transform-origin:center}
.planet:hover .pl,.planet:focus-visible .pl,.planet.on .pl{transform:scale(1.12)}
.planet text{font-family:var(--serif);font-size:15px;fill:#f5e8c8;text-anchor:middle}

/* ---------- guide (Đóm) ---------- */
.guide{display:flex;gap:.8rem;align-items:flex-start;margin:0 0 1.4rem}
.guide-fox{flex:0 0 54px}
.guide-fox svg{width:54px;height:54px;display:block}
.guide-text{flex:1;background:var(--paper);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:.8rem 1rem .5rem;position:relative}
.guide-text .who{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:.2rem}
.narration p{opacity:0;animation:fadeIn 1.2s ease forwards;margin-bottom:.7em}
.guide-pg{font-size:1.02rem;line-height:1.7;margin:.1rem 0 .3rem}.guide-nav{display:flex;align-items:center;gap:.6rem;margin:.2rem 0 .5rem;min-height:1.6rem}.guide-nav .lt-dots{margin:0}.guide-line{font-size:.92rem;color:var(--ink-soft);margin-bottom:.5em}
.guide-ask{font-style:italic;color:var(--accent);margin-bottom:.4em}
#toast{position:fixed;left:50%;bottom:16px;transform:translate(-50%,30px);opacity:0;pointer-events:none;z-index:50;max-width:min(92vw,520px);
  background:#fffaf0;border:1px solid var(--accent);border-radius:14px;padding:.6rem .9rem;box-shadow:0 8px 28px rgba(60,40,20,.25);display:flex;gap:.6rem;align-items:center;font-size:.92rem;font-style:italic;transition:all .5s}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast .t-fox svg{width:36px;height:36px;display:block}

/* ---------- buttons / forms ---------- */
.btn{padding:.7rem 1.25rem;background:transparent;border:1px solid var(--ink);color:var(--ink);font-family:inherit;font-size:.95rem;cursor:pointer;transition:all .2s;margin:0 .4rem .5rem 0;border-radius:2px}
.btn:hover{background:var(--ink);color:var(--bg)}
.btn.accent{border-color:var(--accent);color:var(--accent)}
.btn.accent:hover{background:var(--accent);color:var(--bg)}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn.danger:hover{background:var(--danger);color:var(--bg)}
.btn.soft{border-color:var(--line);color:var(--ink-soft)}
.btn.soft:hover{background:var(--ink-soft);color:var(--bg)}
.btn-mini{padding:.35rem .75rem;background:transparent;border:1px solid var(--ink);color:var(--ink);font-family:inherit;font-size:.8rem;cursor:pointer;transition:all .2s;margin:0 .25rem .3rem 0;border-radius:2px}
.btn-mini:hover{background:var(--ink);color:var(--bg)}
.btn-mini.on{background:var(--ink);color:var(--bg)}
.btn-mini.delete{border-color:var(--line);color:var(--ink-soft);font-size:.74rem}
.btn-mini.delete:hover{border-color:var(--danger);color:var(--danger);background:transparent}
textarea,input[type=text],input[type=number],input[type=date],select{width:100%;padding:.75rem .8rem;border:1px solid var(--line);background:rgba(255,255,255,.55);font-family:inherit;font-size:1rem;line-height:1.55;color:var(--ink);resize:vertical;margin-bottom:.6rem;border-radius:2px}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--accent);background:#fff}
textarea{min-height:84px}
select{appearance:none;-webkit-appearance:none;padding-right:2rem;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--ink-soft) 50%),linear-gradient(135deg,var(--ink-soft) 50%,transparent 50%);background-position:calc(100% - 17px) 55%,calc(100% - 12px) 55%;background-size:5px 5px;background-repeat:no-repeat}
label.lbl{display:block;font-size:.8rem;color:var(--ink-soft);letter-spacing:.04em;margin:.2rem 0 .25rem}
.row{display:flex;gap:.5rem;flex-wrap:wrap}
.row>*{flex:1 1 130px}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1rem}
.chip{padding:.5rem .9rem;background:rgba(240,192,96,.18);border:1px solid #d9b884;border-radius:20px;font-family:inherit;font-size:.9rem;color:var(--ink);cursor:pointer;transition:all .2s;line-height:1.4;text-align:left;max-width:100%}
.chip:hover{background:rgba(240,192,96,.35);border-color:var(--accent)}
.chip.used,.chip.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
.suggest-label{font-size:.85rem;color:var(--ink-soft);font-style:italic;margin-bottom:.7rem}

.saved-list{list-style:none;margin-top:1rem}
.saved-list li{padding:.85rem 0;border-top:1px solid var(--line);white-space:pre-wrap}
.saved-list .meta,.meta{font-size:.78rem;color:var(--ink-soft);margin-top:.25rem;font-style:italic;white-space:normal}
.section{margin-top:2rem;padding-top:1.5rem;border-top:1px solid var(--line)}
.section h3{font-size:.78rem;font-weight:400;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:.9rem}
.status{padding:.85rem 1.1rem;background:var(--warm);border-left:2px solid var(--accent);margin-bottom:1.2rem;font-size:.95rem;font-style:italic;color:var(--ink-soft)}
.panel{background:var(--paper);border:1px solid var(--line);padding:1.1rem;margin:1rem 0;border-radius:3px}
.praise{padding:1.1rem 1.3rem;background:linear-gradient(90deg,rgba(240,192,96,.28),rgba(240,192,96,.05));border-left:2px solid var(--gold);margin-bottom:1.4rem;font-style:italic;animation:praiseIn .9s ease forwards}
@keyframes praiseIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.progress-wrap{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:.8rem}
.progress-bar{height:100%;background:var(--accent);transition:width .5s ease;border-radius:3px}
.pill{display:inline-block;font-size:.72rem;padding:1px 8px;border-radius:9px;background:rgba(156,107,63,.14);color:var(--accent);margin-right:.35rem}
.backup-row{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:1.4rem;padding-top:1.1rem;border-top:1px solid var(--line)}
.hint{font-size:.8rem;color:var(--ink-soft);font-style:italic;margin-top:.8rem}

/* ---------- gallery ---------- */
.toolbar{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem;align-items:center}
.toolbar>*{margin-bottom:0!important;flex:1 1 130px}
.toolbar .grow{flex:2 1 200px}
.seg{display:flex;gap:0;flex:0 0 auto!important}
.seg button{padding:.5rem .8rem;border:1px solid var(--line);background:transparent;font-family:inherit;font-size:.85rem;color:var(--ink-soft);cursor:pointer}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.keeps{display:grid;grid-template-columns:repeat(2,1fr);gap:.8rem}
@media(min-width:560px){.keeps{grid-template-columns:repeat(3,1fr)}}
.keep{background:var(--paper);border:1px solid var(--line);padding:.7rem .6rem .5rem;text-align:center;position:relative;border-radius:3px;transition:transform .25s,box-shadow .25s}
.keep:hover{transform:translateY(-3px);box-shadow:0 8px 18px rgba(60,40,20,.14)}
.keep-open{cursor:pointer;display:block;background:none;border:none;font-family:inherit;color:inherit;width:100%;text-align:center}
.keep svg,.keep img{width:96px;height:96px;display:block;margin:0 auto .3rem}
.keep img{object-fit:cover;border-radius:50%;border:3px solid #d9b884;box-shadow:0 0 0 2px var(--paper),0 0 0 3px #d9b884}
.keep .k-text{font-size:.92rem;line-height:1.4}
.keep .star{position:absolute;top:4px;right:4px;background:none;border:none;font-size:1.15rem;cursor:pointer;color:var(--line);line-height:1;padding:4px}
.keep .star.on{color:var(--gold)}
.keep .acts{margin-top:.3rem}
.tl-group h4{font-size:.9rem;letter-spacing:.05em;color:var(--accent);margin:1.2rem 0 .3rem;border-bottom:1px solid var(--line);padding-bottom:.2rem}
.tl-item{display:flex;gap:.7rem;padding:.55rem 0;align-items:flex-start;border-bottom:1px dashed var(--line)}
.tl-item .dot{flex:0 0 10px;height:10px;border-radius:50%;margin-top:.5rem}
.tl-item .tl-b{flex:1;cursor:pointer;background:none;border:none;text-align:left;font-family:inherit;color:inherit;font-size:1rem}
.review-achievement{padding:1.1rem 1.3rem;background:var(--warm);border-left:2px solid var(--accent);margin-bottom:1.3rem}
.review-achievement img{max-width:100%;max-height:260px;display:block;margin:.6rem 0;border-radius:3px}
.review-q h4{font-size:.92rem;color:var(--ink-soft);margin:1rem 0 .3rem}
.lookback li{padding:.5rem 0;border-top:1px solid var(--line);list-style:none}
.preview-img{max-width:140px;max-height:120px;border-radius:3px;display:block;margin:.3rem 0}

/* ---------- alchemy ---------- */
details.alc-item{border-top:1px solid var(--line);padding:.4rem 0}
details.alc-item summary{cursor:pointer;padding:.5rem 0;list-style:none;display:flex;justify-content:space-between;align-items:baseline;gap:1rem}
details.alc-item summary::-webkit-details-marker{display:none}
details.alc-item summary::before{content:'▸';color:var(--accent);margin-right:.4rem}
details.alc-item[open] summary::before{content:'▾'}
.summary-title{flex:1}
details.alc-item summary .meta{white-space:nowrap;margin:0}
.alc-body{padding:.6rem 0 1.2rem}
.alc-body h4{font-size:.85rem;letter-spacing:.05em;color:var(--ink-soft);margin:1rem 0 .3rem}
.alc-body textarea{min-height:56px}
.alc-progress{display:flex;gap:4px;margin:.5rem 0 .3rem}
.alc-progress .dot{flex:1;height:4px;background:var(--line);border-radius:2px;transition:background .3s}
.alc-progress .dot.filled{background:var(--accent)}
.miles{display:flex;gap:.5rem;flex-wrap:wrap;margin:.3rem 0 .6rem}
.mile{border:1px solid var(--line);padding:.45rem .7rem;font-size:.82rem;background:var(--paper);border-radius:3px}
.mile.due{border-color:var(--gold);background:rgba(240,192,96,.2)}
.mile.done{color:var(--ink-soft)}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin:.5rem 0}
.compare>div{background:var(--paper);border:1px solid var(--line);padding:.6rem .7rem;font-size:.9rem;white-space:pre-wrap}
.compare b{display:block;font-weight:400;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:.2rem}
.loglist li{list-style:none;padding:.5rem 0;border-top:1px dashed var(--line);font-size:.92rem;white-space:pre-wrap}
.loglist .tp{font-size:.75rem;color:var(--accent)}
.loglist .tp.re{color:#8a6a9a}

/* ---------- inner child ---------- */
.ic-acts{display:flex;gap:.5rem;flex-wrap:wrap;margin:.2rem 0 .8rem}
.ic-reply{font-style:italic;color:var(--ink-soft);margin:.3rem 0 .6rem;min-height:3.2em}
.journey{background:#fffaf0;border:1px solid #d9b884;border-radius:6px;padding:1.2rem 1.2rem .9rem;margin:1rem 0}
.journey .j-top{display:flex;justify-content:space-between;align-items:center;font-size:.78rem;color:var(--ink-soft);margin-bottom:.8rem;letter-spacing:.06em}
.journey p{margin-bottom:.8em}
.journey .q{font-size:1.02rem;margin-bottom:.6rem}
.breath{width:90px;height:90px;border-radius:50%;margin:.6rem auto 1rem;background:radial-gradient(circle,#fff4d8,#f0c060 70%,rgba(240,192,96,0));animation:breatheBig 8s ease-in-out infinite}
@keyframes breatheBig{0%,100%{transform:scale(.6);opacity:.6}50%{transform:scale(1.1);opacity:1}}
input[type=range]{width:100%;margin:.4rem 0 .8rem;accent-color:var(--accent)}

/* ---------- light / angel ---------- */
.ang *{transition-property:opacity,transform,fill,stroke;transition-timing-function:ease-in-out}
.ang.no-trans *{transition:none!important;animation-duration:0s!important}
.ang .warm{opacity:0;transition-duration:5s}
.ang .cold{opacity:1;transition-duration:5s}
.ang:is([data-st="2"],[data-st="3"]) .warm{opacity:1}
.ang[data-st="3"] .cold{opacity:0}
.ang[data-st="3"] .coldsky{opacity:0}
.ang .angel{opacity:0;transform:translateY(-250px);transition-duration:6s}
.ang:is([data-st="1"],[data-st="2"]) .angel{opacity:1;transform:translateY(0)}
.ang[data-st="3"] .angel{opacity:.0;transform:translateY(-30px);transition-duration:5s}
.ang .wingL,.ang .wingR{transform-box:fill-box;transform:scaleX(.12);transition-duration:3.5s;transition-delay:3.2s}
.ang .wingL{transform-origin:100% 50%}.ang .wingR{transform-origin:0% 50%}
.ang:is([data-st="1"],[data-st="2"]) :is(.wingL,.wingR){transform:scaleX(1)}
.ang .armR{transform-box:fill-box;transform-origin:0% 0%;transform:rotate(0);transition-duration:3s}
.ang:is([data-st="2"],[data-st="3"]) .armR{transform:rotate(28deg)}
.ang .cone{opacity:0;transition-duration:3s}
.ang[data-st="2"] .cone{opacity:.85}.ang[data-st="3"] .cone{opacity:.35}
.ang .glowc{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(.2);transition-duration:4s}
.ang[data-st="2"] .glowc{opacity:.75;transform:scale(1.6)}
.ang[data-st="3"] .glowc{opacity:.3;transform:scale(2.2)}
.ang .chB{opacity:1;transition-duration:4s}
.ang[data-st="3"] .chB{opacity:0}
.ang .chA{opacity:0;transition-duration:4.5s;transition-delay:.8s}
.ang[data-st="3"] .chA{opacity:1}
.ang .bloom{transform-box:fill-box;transform-origin:50% 100%;transform:scale(0);transition-duration:2.5s}
.ang[data-st="3"] .bloom{transform:scale(1)}
.ang .pt{opacity:0}
.ang:is([data-st="2"],[data-st="3"]) .pt{animation:ptRise 5s ease-out infinite}
@keyframes ptRise{0%{opacity:0;transform:translateY(20px)}30%{opacity:1}100%{opacity:0;transform:translateY(-90px)}}
.ang .stars{transition-duration:5s}.ang[data-st="3"] .stars{opacity:0}
.cap{text-align:center;font-style:italic;color:var(--ink-soft);min-height:3.4em;margin:.2rem 0 .8rem;transition:opacity .6s}
.cinema-bar{text-align:center}

/* ---------- dream / magnetic ---------- */
.goal-card{padding:1.1rem 0;border-top:1px solid var(--line)}
.goal-head{display:flex;gap:.8rem;align-items:flex-start;margin-bottom:.6rem}
.emblem{flex:0 0 58px;height:58px;border-radius:50%;background:var(--warm);border:1px solid #d9b884;overflow:hidden;display:flex;align-items:center;justify-content:center}
.emblem svg,.emblem img{width:100%;height:100%;object-fit:cover}
.goal-title{font-size:1.1rem}
.why{font-style:italic;color:var(--ink-soft);font-size:.92rem;margin:.2rem 0 .5rem}
.actions{list-style:none}
.action-item{display:flex;align-items:center;gap:.5rem;padding:.5rem 0;border-top:1px dashed var(--line);font-size:.95rem;flex-wrap:wrap}
.action-item.done .atext{color:var(--ink-soft);text-decoration:line-through}

function ymd(d) { d = d || new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function parseYmd(s) { const m = /^(\d{4})-(\d\d)-(\d\d)$/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : new Date(s); }

function daysBetween(a, b) { return Math.floor((parseYmd(b) - parseYmd(a)) / 86400000); }

}

/* điện thoại cầm ngang: tranh vừa khít chiều cao màn hình (đo bằng tỉ lệ của chính hình) */

setVh(); addEventListener('resize', setVh); addEventListener('orientationchange', setVh);

  }

    'Dù hôm nay bạn đang vui, đang mỏi mệt hay có những điều chẳng biết tỏ cùng ai, nơi đây luôn có một khoảng lặng để bạn dừng chân, lắng nghe và dịu dàng với chính mình.',
    'Không cần vội vàng, cũng chẳng cần trở thành một ai khác. Cứ là bạn thôi, và bắt đầu từ nơi trái tim mình đang ở.'];

/* Đóm trên bản đồ: lời chào lần đầu, và những câu nói ngẫu nhiên khi rê chuột hoặc chạm vào */
const FOX_HELLO = ['Mình là Đóm!', 'Mình đã ở đây đợi bạn từ rất lâu rồi.', 'Ngôi nhà này đã rất buồn khi thiếu đi bước chân của bạn.', 'Mình sẽ đi cùng bạn, không nhanh hơn, cũng không chậm hơn.', 'Chúng ta bắt đầu nhé?'];
const FOX_BACK = 'Bạn quay lại rồi! Mình vẫn ở đây, không đi đâu cả.';
const FOX_LINES = ['Hôm nay bạn thấy thế nào?', 'Mệt mỏi cũng là một loại cảm xúc hợp lý.', 'Không cần vội đâu. Mình đi cùng bạn.', 'Bạn đã đến đây rồi, vậy là đủ.', 'Chạm vào một ngôi nhà để bước vào nhé.', 'Hít một hơi thật chậm cũng là một cách nghỉ ngơi.', 'Bạn không phải mạnh mẽ ở đây.', 'Mình ở đây, cùng bạn.'];
let foxGreeted = false, foxLast = -1, foxT = 0;
function foxSay(text, ms) {
  const b = $('#fox-bubble'), g = $('.wfox'); if (!b || !g) return;
  b.textContent = text; b.hidden = false; b.classList.remove('in'); void b.offsetWidth; b.classList.add('in');
  const wrap = b.parentElement, W = wrap.offsetWidth, H = wrap.offsetHeight;
  if (W && H) {
    const sc = Math.min(W / 1200, H / 720), ox = (W - 1200 * sc) / 2, oy = (H - 720 * sc) / 2, half = b.offsetWidth / 2, bh = b.offsetHeight;
    let x = ox + (+g.dataset.x) * sc, y = oy + ((+g.dataset.y) - 74) * sc;
    const clampX = v => Math.max(ox + half + 6, Math.min(ox + 1200 * sc - half - 6, v)), clampY = v => Math.max(oy + bh + 8, Math.min(oy + 720 * sc - 6, v));
    /* tránh che tên các phòng: thử nhiều vị trí quanh Đóm, chọn chỗ ít chồng lên bảng tên nhất */
    const tags = $$('.world .loc').map(l => { const m = /translate\(([-\d.]+)[ ,]+([-\d.]+)\)/.exec(l.getAttribute('transform') || ''), p = l.querySelector('.tag .pl'); return m && p ? { l: ox + (+m[1] - (+p.getAttribute('width')) / 2) * sc, r: ox + (+m[1] + (+p.getAttribute('width')) / 2) * sc, t: oy + (+m[2] + 40 - 20) * sc, b: oy + (+m[2] + 40 + 20) * sc } : null; }).filter(Boolean);
    const cost = (cx, cy) => tags.reduce((s, t) => s + Math.max(0, Math.min(cx + half, t.r) - Math.max(cx - half, t.l)) * Math.max(0, Math.min(cy, t.b) - Math.max(cy - bh, t.t)), 0);
    const fx = x, fy = oy + (+g.dataset.y) * sc, cands = [[fx, y], [fx, fy + bh + 22 * sc], [fx - half - 30 * sc, y], [fx + half + 30 * sc, y], [fx, y - bh - 14 * sc], [fx, fy + bh + 70 * sc]];
    let best = null;
    cands.forEach(([cx, cy]) => { cx = clampX(cx); cy = clampY(cy); const c = cost(cx, cy); if (!best || c < best.c - 1) best = { c, x: cx, y: cy }; });
    x = best.x; y = best.y;

  }

}
function wmLandFit() { const s = $('.scene.world.land'); if (!s) return; const v = s.querySelector('svg'); if (v) v.setAttribute('preserveAspectRatio', 'xMidYMax slice'); s.style.width = innerHeight + 'px'; s.style.height = innerWidth + 'px'; s.style.transform = 'translateX(' + innerWidth + 'px) rotate(90deg)'; }
function wmLandOff(s) { const v = s.querySelector('svg'); if (v) v.removeAttribute('preserveAspectRatio'); s.classList.remove('land'); ['width', 'height', 'transform'].forEach(p => { s.style[p] = ''; }); document.body.style.overflow = ''; }

  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = 'soul-haven-backup-' + ymd() + '.json'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 500); toast('Bản sao lưu đã được tạo. Hãy cất nó ở nơi an toàn.');

ACT.undo_import = () => {
  const bak = localStorage.getItem(BAK_KEY); if (!bak) return;
  if (!confirm('Quay lại bản dữ liệu trước lần nhập/nâng cấp gần nhất? Dữ liệu hiện tại sẽ được thay thế.')) return;

document.addEventListener('change', e => {
  if (!e.target || e.target.id !== 'import-file') return;
  const file = e.target.files[0]; if (!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    let parsed;
    try { parsed = JSON.parse(rd.result); } catch (err) { alert('File không đọc được. Có thể không phải bản sao lưu của Soul Haven.'); return; }
    const known = ['innerChild', 'mountain', 'gallery', 'alchemy', 'light', 'dream', 'magnetic'];
    if (!isObj(parsed) || !known.some(k => k in parsed)) { alert('File này không giống bản sao lưu Soul Haven nên chưa được nhập.'); return; }
    const next = normalize(parsed);
    const n = next.gallery.achievements.length + next.alchemy.items.length + next.light.prayers.length + next.dream.goals.length + next.mountain.burdens.length;
    if (!confirm('Nhập bản sao lưu này (' + n + ' mục chính)? Dữ liệu hiện tại sẽ được thay thế, nhưng bản hiện tại vẫn được giữ lại để hoàn tác.')) return;
    try { localStorage.setItem(BAK_KEY, JSON.stringify(state)); } catch (err) {}
    state = next; save(); toast('Đã nhập. Thế giới của bạn đã quay về.'); render();
  };
  rd.readAsText(file); e.target.value = '';
});

function readImage(file, max) {
  return new Promise((res, rej) => {
    if (!file || !/^image\//.test(file.type)) return rej(new Error('type'));
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = () => rej(new Error('img')); img.src = fr.result;
    };
    fr.onerror = () => rej(new Error('read')); fr.readAsDataURL(file);
  });
}

/* --- trạng thái & luồng trải nghiệm --- */
let LT_RUN = 0;
const ltFresh = () => ({ ph: 'meet', sub: 'intro', paused: false, sound: true, topic: 'own', anims: [] });
let ui = { alchemy: { open: new Set() }, light: ltFresh(), ic: icFresh(), al: alFresh(), gl: glFresh(), mt: mtFresh(), mf: mfFresh() };
function resetUi() { LT_RUN++; ui.light = ltFresh(); if (typeof icStop === 'function') icStop(); ui.ic = icFresh(); if (typeof alStop === 'function') alStop(); ui.al = alFresh(); ui.gl = glFresh(); if (typeof mtStop === 'function') mtStop(); ui.mt = mtFresh(); ui.mf = mfFresh(); }
const ltCancel = () => ++LT_RUN;
function ltWait(ms, tok) {
  return new Promise(res => { let left = ms; const t = setInterval(() => { if (tok !== LT_RUN) { clearInterval(t); res(false); return; } if (!ui.light.paused) left -= 100; if (left <= 0) { clearInterval(t); res(true); } }, 100); });
}
function softIn(el, delay) { el.animate([{ opacity: 0, transform: REDUCED ? 'none' : 'translateY(8px)' }, { opacity: 1, transform: 'none' }], { duration: 1100, delay: delay || 0, easing: 'ease-out', fill: 'backwards' }); }
const nbLast = s => s.replace(/ (\S+)$/, '\u00A0$1').replace(/ ([^ ]+ [^ ]+)$/, ' $1');
const LT_PAGES = {
  intro: { p: [['Có những lúc, điều ta cần nhất không phải là một lời khuyên.'], ['Mà chỉ là cảm giác được yêu thương và chở che.'], ['Lại đây nào, hãy để ta ôm con một chút.']] },
  hugging: { p: [['Bạn đang được ôm. Cứ ở đây bao lâu bạn muốn.', 1], ['Con không cô đơn trên hành trình này.'], ['Bất cứ khi nào con mệt mỏi và lạc lõng, hãy quay lại đây.'], ['Ta sẽ gửi con tình yêu và sự chữa lành.']] },
  quiet: { p: [['Bây giờ, hãy nhắm mắt lại một chút.'], ['Con đang mong điều gì nhất?'], ['Hãy để trái tim mình tự do nói ra.']] },
  sending: { p: [['Điều ước của bạn đang hóa thành một đốm sáng nhỏ, bay lên giữa những vì sao…', 1]] },
  blessing: { p: [['Ta mong con luôn được bao bọc bởi tình yêu thương.'], ['Hãy tin rằng những điều tốt đẹp vẫn có thể tìm đến.'], ['Và con cũng có sức mạnh để từng bước tạo nên điều mình mong muốn.']] },
  final: { who: 'Lời chúc dành cho bạn', p: [['Con xứng đáng được yêu thương, được bình an và được đón nhận những điều tốt đẹp.'], ['Mong rằng mỗi ngày, con sẽ tìm thấy thêm một lý do để mỉm cười.'], ['Và thêm một chút can đảm để sống cuộc đời mình mong muốn.']] },
  stay: { p: [['Bạn cứ ngồi lại ngắm khu vườn, ánh sáng và những thiên thần bao lâu tùy ý.', 1], ['Không có gì phải làm cả.', 1]] }
};
const ltPg = () => { const d = LT_PAGES[ui.light.sub]; return d ? d.p.length : 0; };
function ltBubbleShow() {
  const b = $('#lt-bubble'), L = ui.light, d = LT_PAGES[L.sub]; if (!b) return; if (!d) { b.hidden = true; return; }
  const pg = Math.min(L.pg || 0, d.p.length - 1), x = d.p[pg];
  b.innerHTML = '<b>' + esc(d.who || 'Vị thầy') + '</b><p class="' + (x[1] ? 'narr' : 'master') + '">' + nbLast(esc(x[0])) + '</p>' + (d.p.length > 1 ? '<span class="lt-dots" aria-hidden="true">' + d.p.map((_, i) => '<i class="' + (i === pg ? 'on' : '') + '"></i>').join('') + '</span>' : '');
  b.hidden = false; softIn(b, 0);
}
function ltPanelHtml() {
  const L = ui.light;
  switch (L.sub) {
    case 'hugging': case 'quiet': return '<div class="lt-breath" aria-hidden="true"></div>';
    case 'form': return `<label class="lbl" for="lt-wish" data-d="200">Điều ước con muốn gửi gắm là…</label>

      <div class="err" id="lt-err" role="alert"></div><button type="button" class="btn accent" data-act="lt_send">Gửi</button>`;
  }
  return '';
}
function ltCtaHtml() {
  const b = (a, l, c) => `<button type="button" class="btn ${c || ''}" data-act="${a}">${l}</button>`, L = ui.light, n = ltPg();
  if (n > 1 && (L.pg || 0) < n - 1 && L.sub !== 'sending') return b('lt_next', 'Tiếp', 'accent');
  switch (L.sub) {
    case 'intro': return b('lt_hug', 'Ôm', 'accent');
    case 'hugging': case 'blessing': return b('lt_skip', 'Tiếp', 'accent');
    case 'quiet': return b('lt_skip', 'Viết ước', 'accent');
    case 'final': return b('lt_stay', 'Ở lại') + b('lt_carry', 'Mang theo', 'accent');
    case 'stay': return b('lt_restart', 'Xem lại', 'soft') + b('lt_carry', 'Mang theo', 'accent');
  }
  return '';
}function ltSetCta() { const c = $('#lt-cta'); if (c) { c.innerHTML = ltCtaHtml(); $$('button', c).forEach(el => softIn(el, ui.light.sub === 'intro' ? 3000 : 500)); } }
function fadeSwap(p, fn) {
  if (!p || !p.firstElementChild) { fn(); return; }
  const a = p.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 260, easing: 'ease-in', fill: 'forwards' });
  let done = false; const go = () => { if (done) return; done = true; fn(); a.cancel(); };
  a.onfinish = go; setTimeout(go, 400);
}
function ltSetPanel(sub) {
  if (sub) { ui.light.sub = sub; ui.light.pg = 0; } ltBubbleShow();
  if (sub) ui.light.sub = sub;
  const p = $('#lt-panel'); if (!p) return;
  const sk = $('#lt-skip-btn'); if (sk) sk.hidden = ['final', 'stay', 'sending'].includes(ui.light.sub);
  fadeSwap(p, () => { p.innerHTML = ltPanelHtml(); restoreDrafts(); $$('[data-d]', p).forEach(el => softIn(el, +el.dataset.d)); ltSetCta(); });
}
function ltSetPh(ph) { ui.light.ph = ph; const g = $('#garden'); if (g) g.setAttribute('data-ph', ph); }
function ltSyncBtns() {
  ['music', 'water', 'rain'].forEach(k => { const s = document.getElementById('lt-snd-' + k); if (s) s.classList.toggle('on', !!Sound[k]); });
  const p = $('#lt-pause-btn'); if (p) { p.textContent = ui.light.paused ? 'Tiếp' : 'Dừng'; p.classList.toggle('on', ui.light.paused); }
}
function ltDiaryHtml() {
  const l = state.light.prayers.slice().reverse();

}

/* --- căn phòng được phép yếu lòng --- */
/* khói cảm xúc: dải Bézier mềm (Catmull-Rom → cubic), tô gradient mờ dần về đuôi */
const smkCat = (p) => { let d = ''; for (let i = 0; i < p.length - 1; i++) { const p0 = p[Math.max(i - 1, 0)], p1 = p[i], p2 = p[i + 1], p3 = p[Math.min(i + 2, p.length - 1)]; d += `C${(p1[0] + (p2[0] - p0[0]) / 6).toFixed(1)},${(p1[1] + (p2[1] - p0[1]) / 6).toFixed(1)} ${(p2[0] - (p3[0] - p1[0]) / 6).toFixed(1)},${(p2[1] - (p3[1] - p1[1]) / 6).toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)} `; } return d; };
const smkRibbon = (c, wf) => {
  const L = [], R = [];
  c.forEach((p, i) => { const a = c[Math.max(i - 1, 0)], b = c[Math.min(i + 1, c.length - 1)]; let tx = b[0] - a[0], ty = b[1] - a[1]; const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl; const w = wf(i / (c.length - 1)) / 2; L.push([p[0] - ty * w, p[1] + tx * w]); R.push([p[0] + ty * w, p[1] - tx * w]); });

function icRefreshSpark() { const c = $('.ic-ctrl'); if (!c) return; const old = $('.ic-spark', c), hints = $$('.hint', c); if (old) { old.nextElementSibling && old.nextElementSibling.remove(); old.remove(); } const tmp = document.createElement('div'); tmp.innerHTML = icSpark(); while (tmp.firstChild) c.appendChild(tmp.firstChild); }

function alPI(p) {

}
const alFlies = (n, r0) => `<g class="orbit" style="animation-duration:${(7 - Math.min(n, 4) * .8).toFixed(1)}s">` + Array.from({ length: n }, (_, i) => `<g transform="rotate(${i * 360 / n}) translate(${r0 + (i % 3) * 12},0)"><ellipse rx="3.4" ry="2.2" fill="#1a1a1a"/><ellipse class="wing" cy="-2.4" rx="4.4" ry="2" fill="#ccd" opacity=".6"/></g>`).join('') + '</g>';

function grHug() {
  const G = GR; if (G.step >= 6) return grDone('Bạn đã ở đây rồi. Bạn đã ra khỏi nơi đó, cùng với bé.');

  return `<p class="gr-line" aria-live="polite">${GR_HUG_LINES[G.step]}</p>${grHugScene(G)}<p class="gr-line" id="gr-hug-msg" aria-live="polite" style="min-height:1.5em"></p><div class="gr-act">${acts[G.step]}</div><div class="gr-bar" id="gr-hbar" ${G.step === 3 ? '' : 'hidden'}><i></i></div>`;
}
function grBindHug() {
  const G = GR, a = $('#gr-adult');
  if (G.step === 1 && a) { a.animate([{ transform: 'translateX(900px)' }, { transform: 'translateX(400px)' }], { duration: 2600, easing: 'ease-out' }); a.style.transform = 'translateX(400px)'; const b = $('#gr-speak'); if (b) b.onclick = () => grHugSpeak(b); }
  if (G.step === 3) {
    const btn = $('#gr-hold'), bar = $('#gr-hbar i'); let p = 0, on = false, last = 0;
    const tick = t => { if (!grEl) return; const dt = Math.min(.25, (t - last) / 1000); last = t; p = Math.max(0, Math.min(1, p + (on ? dt / 4 : -dt / 8))); bar.style.width = (p * 100) + '%'; if (a) a.style.transform = `translateX(${(400 + p * 32).toFixed(1)}px)`;
      if (p >= 1) { on = false; G.step = 4; grRender(); return; } grRaf = requestAnimationFrame(tick); };
    const down = () => { if (!on) { on = true; last = performance.now(); } }, up = () => { on = false; };
    btn.addEventListener('pointerdown', e => { e.preventDefault(); try { btn.setPointerCapture(e.pointerId); } catch (x) {} down(); });
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => btn.addEventListener(t, up));
    btn.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); down(); } });
    btn.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); up(); } });
    last = performance.now(); grRaf = requestAnimationFrame(tick);
  }
}
function grHugSpeak(b) {

    msg: ['Tình yêu không chỉ là cảm giác tìm thấy một người khiến trái tim rung động. Đó còn là việc hai người lựa chọn đối xử với nhau như thế nào mỗi ngày.', 'Và đôi khi, lá bài này không nói về một người khác. Nó hỏi bạn có đang sống hòa hợp với những giá trị sâu thẳm của chính mình hay không.', 'Đừng chọn điều khiến bạn rung động nhất mà quên hỏi liệu nó có thực sự tốt cho mình.'],
    sp: 'Sự kết nối sâu sắc bắt đầu từ khả năng thành thật với trái tim.', re: 'Quan sát hành vi, sự tôn trọng, trách nhiệm và mức độ tương thích, thay vì chỉ dựa vào cảm xúc.',
    q: 'Bạn đang lựa chọn bằng tình yêu hay bằng nỗi sợ cô đơn?', act: 'Xác định ba giá trị không thể thiếu trong một mối quan hệ lành mạnh.', note: 'Đừng đánh mất chính mình để được lựa chọn bởi một người khác.' },
  { n: 'VII', vn: 'Cỗ Xe Chiến Thắng', en: 'The Chariot', th: 'Quyết tâm, tiến lên và khả năng làm chủ.', col: '#7ad0c8', em: 'chariot',
    msg: ['Bạn không thể điều khiển mọi thứ xảy ra trên đường đời, nhưng bạn có thể quyết định mình sẽ phản ứng như thế nào.', 'Có những giai đoạn cần tiến lên mạnh mẽ. Có những lúc cần giảm tốc để điều chỉnh hướng đi.', 'Tiến nhanh không đồng nghĩa với tiến đúng. Đừng để sự nôn nóng biến mục tiêu thành một cuộc chạy đua vô nghĩa.'],
    sp: 'Hãy giữ niềm tin vào hướng đi mà bạn đã lựa chọn.', re: 'Xác định ưu tiên, theo dõi tiến độ và điều chỉnh kế hoạch khi hoàn cảnh thay đổi.',
    q: 'Bạn đang tiến về mục tiêu của mình hay chỉ đang cố chứng minh rằng mình không thất bại?', act: 'Chọn một việc quan trọng nhất và hoàn thành nó trước khi phân tán năng lượng.', note: 'Sức mạnh không chỉ nằm ở tốc độ. Nó nằm ở khả năng giữ vững tay lái.' },
  { n: 'VIII', vn: 'Sức Mạnh', en: 'Strength', th: 'Nội lực, lòng kiên nhẫn và khả năng điều hòa cảm xúc.', col: '#f0a058', em: 'strength',
    msg: ['Không phải lúc nào mạnh mẽ cũng có nghĩa là chiến đấu.', 'Có những con thú bên trong bạn không cần bị tiêu diệt. Chúng cần được hiểu, được thuần hóa và được dẫn dắt.', 'Giận dữ, sợ hãi, ghen tị hay tổn thương đều là những trải nghiệm con người. Điều quan trọng không phải là phủ nhận chúng, mà là không để chúng điều khiển mọi hành động của bạn.'],
    sp: 'Sự dịu dàng cũng có thể là một dạng sức mạnh rất lớn.', re: 'Học cách nhận diện cảm xúc, tạm dừng trước khi phản ứng và xây dựng khả năng chịu đựng áp lực.',
    q: 'Bạn đang kiểm soát cảm xúc hay đang cố giả vờ rằng mình không có cảm xúc?', act: 'Khi có điều khiến bạn khó chịu, hãy dừng lại và gọi tên cảm xúc trước khi phản ứng.', note: 'Người mạnh mẽ không phải người không có bóng tối, mà là người biết cách bước đi cùng nó.' },
  { n: 'IX', vn: 'Ẩn Sĩ', en: 'The Hermit', th: 'Cô độc, tự nhận thức và tìm kiếm phương hướng.', col: '#b8c8e0', em: 'hermit',
    msg: ['Có những câu trả lời chỉ xuất hiện khi bạn ngừng hỏi tất cả mọi người rằng mình nên sống thế nào.', 'Đôi khi, bạn cần rời khỏi đám đông để nghe lại tiếng nói của chính mình.', 'Nhưng hãy nhớ: cô độc để trưởng thành khác với cô lập vì sợ hãi. Đừng biến hành trình tìm hiểu bản thân thành lý do để từ chối mọi kết nối.'],
    sp: 'Sự tĩnh lặng có thể mở ra những tầng nhận thức mới.', re: 'Dành thời gian suy ngẫm, nhưng vẫn duy trì những mối quan hệ hỗ trợ lành mạnh.',
    q: 'Nếu không cần làm hài lòng bất kỳ ai, bạn thực sự muốn điều gì?', act: 'Dành một khoảng thời gian không thiết bị để viết ra những điều mình đang tìm kiếm.', note: 'Hãy đi vào bên trong để tìm ánh sáng, nhưng đừng quên rằng thế giới bên ngoài vẫn đang chờ bạn.' },
  { n: 'X', vn: 'Bánh Xe Số Phận', en: 'Wheel of Fortune', th: 'Chu kỳ, thay đổi, cơ hội và bất định.', col: '#f0d070', em: 'wheel',
    msg: ['Cuộc sống không đứng yên để chờ bạn chuẩn bị xong.', 'Có những cơ hội đến bất ngờ. Có những điều tưởng như chắc chắn lại thay đổi chỉ sau một đêm.', 'Bạn không thể kiểm soát tất cả biến động, nhưng có thể chuẩn bị để mình không hoàn toàn bị động trước chúng.', 'Đừng xem mọi may mắn là thành tựu của riêng mình, cũng đừng xem mọi bất lợi là dấu hiệu cho thấy mình không xứng đáng.'],
    sp: 'Hãy mở lòng trước những chu kỳ mới và những khả năng chưa từng nghĩ đến.', re: 'Duy trì quỹ dự phòng, cập nhật kỹ năng và không phụ thuộc toàn bộ tương lai vào một cơ hội duy nhất.',
    q: 'Nếu hoàn cảnh thay đổi ngày mai, điều gì trong cuộc sống của bạn vẫn có thể đứng vững?', act: 'Chuẩn bị một phương án dự phòng cho kế hoạch quan trọng nhất hiện tại.', note: 'Bạn không điều khiển được bánh xe, nhưng có thể rèn luyện đôi chân để đứng vững khi nó xoay.' },
  { n: 'XI', vn: 'Công Lý', en: 'Justice', th: 'Sự thật, công bằng và trách nhiệm.', col: '#a8d8a0', em: 'justice',
    msg: ['Đôi khi, điều bạn cần nhất không phải là một lời an ủi, mà là sự thành thật.', 'Hãy nhìn lại một lựa chọn gần đây của mình bằng đôi mắt công bằng, và hỏi mình có thể làm khác đi điều gì.', 'Nhưng công bằng không đồng nghĩa với việc tự kết án mình vì những sai lầm trong quá khứ.'],
    sp: 'Sống hài hòa với những giá trị mà bạn tin tưởng.', re: 'Đánh giá sự việc dựa trên bằng chứng, nhìn nhận trách nhiệm và sửa chữa những gì có thể.',
    q: 'Có sự thật nào bạn đang né tránh vì nó buộc bạn phải thay đổi?', act: 'Nhìn lại một quyết định gần đây và viết ra điều bạn có thể làm tốt hơn.', note: 'Sự thật có thể không dễ chịu, nhưng nó là nền móng của một cuộc sống tự do.' },
  { n: 'XII', vn: 'Người Treo Ngược', en: 'The Hanged Man', th: 'Tạm dừng, thay đổi góc nhìn và buông bỏ sự kiểm soát.', col: '#88b8d8', em: 'hanged',
    msg: ['Không phải mọi sự trì hoãn đều là thất bại. Có những lúc dừng lại là cách duy nhất để nhận ra mình đang đi sai hướng.', 'Nhưng cũng đừng lãng mạn hóa sự chờ đợi. Không phải cứ chịu đựng lâu hơn thì mọi thứ sẽ tự nhiên tốt đẹp hơn.', 'Hãy tự hỏi: mình đang kiên nhẫn hay đang mắc kẹt?'],
    sp: 'Cho phép bản thân nhìn cuộc sống từ một góc độ khác.', re: 'Tạm dừng để đánh giá chi phí, lợi ích và khả năng thay đổi phương pháp.',
    q: 'Điều gì bạn đang cố giữ, dù nó đã không còn phù hợp?', act: 'Tạm ngừng một thói quen không hiệu quả và thử một cách tiếp cận mới.', note: 'Đôi khi thay đổi góc nhìn còn quan trọng hơn việc cố gắng đi nhanh hơn.' },
  { n: 'XIII', vn: 'Cái Chết', en: 'Death', th: 'Kết thúc, chuyển hoá và một khởi đầu mới.', col: '#c8a8e8', em: 'death',
    msg: ['Lá bài này hiếm khi nói về cái chết thật sự. Nó nói về những điều đã đến lúc khép lại để điều khác có chỗ bắt đầu.', 'Có những giai đoạn, thói quen hay vai trò từng nuôi dưỡng bạn nhưng giờ không còn phù hợp. Buông chúng có thể đau, nhưng giữ chặt cũng có cái giá của nó.', 'Hãy cho phép mình tiếc nuối, rồi cho phép mình đi tiếp.'],
    sp: 'Mỗi kết thúc đều mang theo khả năng của một khởi đầu.', re: 'Chủ động khép lại những việc đã cạn, sắp xếp chuyển giao và chuẩn bị bước tiếp theo thay vì kéo dài mãi.',
    q: 'Điều gì đã hoàn thành vai trò của nó trong cuộc đời bạn?', act: 'Viết ra một điều bạn sẵn sàng khép lại, và một điều bạn muốn mở ra.', note: 'Bướm chỉ bay được khi rời chiếc kén. Nhưng nó cũng cần thời gian để đôi cánh khô lại.' },
  { n: 'XIV', vn: 'Tiết Chế', en: 'Temperance', th: 'Cân bằng, kiên nhẫn và sự hoà hợp.', col: '#a8d8f0', em: 'temperance',
    msg: ['Không phải điều gì cũng cần làm nhiều hơn hay nhanh hơn. Có những điều chỉ tốt lên khi bạn tìm được liều lượng vừa phải.', 'Hãy nhìn xem cuộc sống mình đang nghiêng về phía nào: làm việc hay nghỉ ngơi, cho đi hay giữ lại, kế hoạch hay buông thả.', 'Cân bằng không phải trạng thái cố định. Đó là việc điều chỉnh nhẹ nhàng mỗi ngày.'],
    sp: 'Sự hài hoà đến từ việc hoà đúng lượng những điều tưởng như đối lập.', re: 'Điều chỉnh khối lượng công việc, chi tiêu và thời gian nghỉ theo từng giai đoạn, thay vì dồn sức rồi kiệt quệ.',
    q: 'Phần nào trong cuộc sống của bạn đang quá nhiều, và phần nào đang quá ít?', act: 'Chọn một thói quen nhỏ để bớt đi hoặc thêm vào, và thử trong một tuần.', note: 'Kiên nhẫn không phải chờ đợi thụ động. Đó là làm đều tay trong khi để mọi thứ có thời gian hoà vào nhau.' },
  { n: 'XV', vn: 'Ác Quỷ', en: 'The Devil', th: 'Ràng buộc, thói quen khó bỏ và những điều đang giữ chân bạn.', col: '#e8707a', em: 'devil',
    msg: ['Có những sợi xích không làm bằng sắt. Chúng được làm từ thói quen, nỗi sợ, sự phụ thuộc hay niềm tin rằng mình không có lựa chọn.', 'Điều đáng chú ý ở lá bài này là những chiếc vòng thường lỏng hơn ta tưởng. Nhận ra chúng đã là bước đầu tiên.', 'Bạn không cần tự trách vì đã bị ràng buộc. Chỉ cần thành thật xem điều gì đang giữ mình lại.'],
    sp: 'Nhìn thẳng vào điều ràng buộc có thể trả lại cho bạn sự tự do.', re: 'Xem lại những cam kết, thói quen chi tiêu hay mối quan hệ đang làm bạn hao mòn, và tìm sự hỗ trợ nếu cần.',
    q: 'Điều gì bạn đang gọi là "không thể bỏ", trong khi thật ra là "chưa dám bỏ"?', act: 'Viết ra một thói quen đang chi phối bạn và một bước rất nhỏ để nới lỏng nó.', note: 'Nếu sợi xích khiến bạn kiệt sức, hãy nhờ một người đáng tin cùng nhìn. Bạn không cần tự gỡ mọi thứ một mình.' },
  { n: 'XVI', vn: 'Toà Tháp', en: 'The Tower', th: 'Biến cố bất ngờ, sự sụp đổ của điều không còn vững.', col: '#f0b060', em: 'tower',
    msg: ['Có những điều sụp đổ bất ngờ, và bạn thấy choáng váng như vừa mất chỗ dựa.', 'Nhưng nhiều khi, thứ sụp đổ là thứ đã nứt từ lâu: một giả định, một kế hoạch, một mối quan hệ được giữ bằng sự né tránh.', 'Bạn không cần hiểu hết ngay. Việc đầu tiên là đứng vững, thở, và tìm một chỗ an toàn.'],
    sp: 'Khi lớp vỏ cũ vỡ ra, bạn có cơ hội xây lại trên nền vững hơn.', re: 'Chuẩn bị quỹ dự phòng và phương án B. Khi biến cố xảy ra, xử lý từng việc cấp thiết một.',
    q: 'Nếu phải xây lại, bạn muốn giữ lại điều gì và không mang theo điều gì?', act: 'Viết danh sách ngắn những điều cần ổn định trước trong tuần này: chỗ ở, tiền, sức khoẻ, người hỗ trợ.', note: 'Sụp đổ không có nghĩa là bạn thất bại. Đôi khi đó là cuộc sống dọn chỗ cho thứ chắc chắn hơn.' },
  { n: 'XVII', vn: 'Ngôi Sao', en: 'The Star', th: 'Hy vọng, chữa lành và niềm tin nhẹ nhàng.', col: '#f4e08a', em: 'star',
    msg: ['Sau một giai đoạn dài mệt mỏi, hy vọng thường không đến như tiếng trống. Nó đến như một ngôi sao nhỏ hiện ra khi trời tối.', 'Bạn không cần tin mọi thứ sẽ ổn ngay. Chỉ cần tin rằng mình vẫn đang hồi phục, dù chậm.', 'Hãy cho phép mình nhận lấy sự dịu dàng, từ người khác và từ chính mình.'],
    sp: 'Niềm tin nhỏ nhưng bền bỉ có thể dẫn đường trong bóng tối.', re: 'Đặt mục tiêu nhỏ, đo được, và ghi nhận tiến bộ nhỏ thay vì chờ một thay đổi lớn.',
    q: 'Điều gì, dù rất nhỏ, vẫn đang cho bạn thấy ánh sáng?', act: 'Viết ra ba điều nhỏ đang tốt lên, hoặc ba điều bạn biết ơn hôm nay.', note: 'Ngôi sao không xua tan bóng tối. Nó chỉ cho bạn thấy bóng tối không phải là tất cả.' },
  { n: 'XVIII', vn: 'Mặt Trăng', en: 'The Moon', th: 'Mơ hồ, nỗi lo và những điều chưa rõ.', col: '#b8a8f0', em: 'moon',
    msg: ['Dưới ánh trăng, mọi thứ trông khác đi. Bóng cây có thể giống một con thú, và một nỗi lo nhỏ có thể trở nên rất lớn.', 'Có những điều bạn chưa nhìn rõ, và bạn đang lấp khoảng trống bằng những kịch bản đáng sợ nhất.', 'Hãy tách điều bạn thật sự biết khỏi điều bạn đang tưởng tượng. Nhiều chuyện sẽ rõ hơn khi trời sáng.'],
    sp: 'Cho phép bản thân chưa biết ngay mọi câu trả lời.', re: 'Tránh quyết định lớn khi đang lo lắng cao độ. Thu thập thêm thông tin và hỏi một người đáng tin.',
    q: 'Phần nào trong nỗi lo của bạn là sự việc thật, phần nào là tưởng tượng?', act: 'Viết hai cột: điều tôi biết chắc, và điều tôi đang đoán.', note: 'Đêm nào rồi cũng qua. Hãy đi chậm, bước nào chắc bước đó, và đừng ngại hỏi đường.' },
  { n: 'XIX', vn: 'Mặt Trời', en: 'The Sun', th: 'Niềm vui, sức sống và sự rõ ràng.', col: '#ffd060', em: 'sun',
    msg: ['Có những ngày mọi thứ đơn giản sáng lên: bạn thấy nhẹ nhõm, biết ơn, hoặc chỉ muốn cười.', 'Hãy đón lấy khoảnh khắc ấy mà không cần tự hỏi nó sẽ kéo dài bao lâu.', 'Niềm vui không phải phần thưởng chỉ dành cho người đã giải quyết xong mọi thứ. Bạn được phép có nó ngay bây giờ.'],
    sp: 'Hãy để mình tận hưởng điều tốt đẹp mà không thấy có lỗi.', re: 'Ghi nhận điều đang hiệu quả và làm tiếp, nhưng đừng chủ quan bỏ qua việc chuẩn bị.',
    q: 'Điều gì khiến bạn thấy sống động nhất gần đây, và bạn có thể làm nhiều hơn một chút không?', act: 'Dành mười phút làm một điều bạn thích mà không cần lý do.', note: 'Ánh sáng không đòi bạn phải xứng đáng. Hãy bước ra và để nó chạm vào mặt bạn.' },
  { n: 'XX', vn: 'Phán Xét', en: 'Judgement', th: 'Tiếng gọi thức tỉnh, nhìn lại và tha thứ.', col: '#f0a8c8', em: 'judgement',
    msg: ['Có một tiếng gọi bên trong nhắc bạn nhìn lại con đường đã qua, không để phán xét, mà để hiểu.', 'Bạn có thể trân trọng những gì đã học, tha thứ cho điều chưa làm được, và chọn hướng mới với tâm thế rõ ràng hơn.', 'Đây là lúc đánh giá thành thật, nhưng bằng giọng của một người bạn, không phải của một quan toà.'],

  { self: 'Hôm nay hãy cho phép mình buông một điều nhỏ đã hết vai trò.', love: 'Một mối quan hệ cũng có thể đổi hình thức. Hãy thành thật xem điều gì cần khép lại để điều lành mạnh hơn bắt đầu.', work: 'Có thể đã đến lúc khép một dự án hay cách làm cũ để mở đường cho cái mới.', money: 'Cắt bớt khoản chi không còn giá trị và chuyển nguồn lực sang điều bạn thật sự cần.' },
  { self: 'Hôm nay hãy xen kẽ làm việc và nghỉ ngơi, đừng dồn hết vào một phía.', love: 'Cho và nhận cân bằng giúp mối quan hệ nhẹ nhàng hơn. Bạn đang cho quá nhiều hay quá ít?', work: 'Chia đều năng lượng trong tuần để không kiệt sức giữa chừng.', money: 'Một kế hoạch cân bằng giữa để dành, chi tiêu cần thiết và một chút niềm vui.' },
  { self: 'Hãy để ý một thói quen bạn làm theo quán tính, và hỏi mình nó đang mang lại gì.', love: 'Hãy phân biệt gắn bó lành mạnh với phụ thuộc vì sợ cô đơn. Nếu bị kiểm soát hay tổn thương, hãy nói chuyện với một người đáng tin.', work: 'Có điều gì khiến bạn ở lại một chỗ chỉ vì sợ thay đổi?', money: 'Xem lại nợ, chi tiêu bốc đồng hay cam kết đang ràng buộc bạn, và tìm người hỗ trợ nếu cần.' },
  { self: 'Nếu đang chao đảo, hãy làm điều đơn giản nhất: uống nước, thở chậm, nói với một người đáng tin.', love: 'Một sự thật vừa lộ ra có thể đau, nhưng cho bạn cơ hội xây lại trên nền thật thà hơn.', work: 'Thay đổi bất ngờ trong công việc cần bình tĩnh xếp ưu tiên từng việc và cập nhật phương án dự phòng.', money: 'Kiểm tra quỹ dự phòng và các khoản cố định. Bình tĩnh trước, quyết định lớn sau.' },
  { self: 'Hôm nay hãy làm một điều nhỏ để chăm sóc mình, như đang chăm một người bạn.', love: 'Hy vọng trong tình cảm bắt đầu từ việc dịu dàng với chính mình và với người kia.', work: 'Giữ một mục tiêu nhỏ làm kim chỉ nam, và ghi nhận tiến bộ mỗi ngày.', money: 'Một khoản để dành nhỏ nhưng đều đặn là hạt giống của cảm giác an tâm.' },

  { self: 'Hãy nhìn lại một việc gần đây bằng giọng của một người bạn tử tế.', love: 'Tha thứ không có nghĩa là quên. Nó có thể giúp bạn nhẹ lòng, dù mối quan hệ đi tiếp hay không.', work: 'Đây là lúc rà soát thành quả và học từ sai sót để điều chỉnh hướng đi.', money: 'Nhìn lại các quyết định tiền bạc đã qua và rút ra một bài học để làm tốt hơn.' },
  { self: 'Hãy ghi nhận một điều bạn đã hoàn thành, dù nhỏ, và cho phép mình tự hào.', love: 'Một giai đoạn của mối quan hệ khép lại để giai đoạn mới bắt đầu. Hãy biết ơn chặng đã qua.', work: 'Tổng kết dự án, ghi lại bài học và nghỉ một nhịp trước khi bắt đầu việc mới.', money: 'Xem lại mục tiêu tài chính vừa đạt và đặt mục tiêu kế tiếp, vừa sức.' }
];
function orSteps(c, topic, more) {
  const i = OR_CARDS.indexOf(c), s = [{ k: 'card' }, { k: 'msg', t: c.msg[0] }];
  if (topic && OR_TP[i] && OR_TP[i][topic]) s.push({ k: 'topic', t: OR_TP[i][topic], tp: topic });
  s.push({ k: 'q', t: c.q });
  if (more) s.push({ k: 'view' }, { k: 'act', t: c.act }, { k: 'note', t: c.note });
  s.push({ k: 'reflect' });
  return s;
}
function orDraw() {
  const last = orDraws().slice(-1)[0], used = new Set(orTodayAll().map(d => d.card)); if (last) used.add(last.card); let pool = OR_CARDS.map((_, i) => i).filter(i => !used.has(i)); if (!pool.length) pool = OR_CARDS.map((_, i) => i); const i = pool[Math.floor(Math.random() * pool.length)]; OR.again = false;
  orDraws().push({ id: uid(), date: ymd(), card: i, topic: OR.topic, note: '' }); save(); orShow(i);
}
function orShow(i, topic) { OR.card = i; if (topic != null) OR.topic = topic; OR.more = false; OR.steps = orSteps(OR_CARDS[i], OR.topic, false); OR.si = 0; OR.stage = 'steps'; orRender(); }
function orClick(e) {
  const b = e.target.closest('[data-o]'); if (!b || !OR) return; const k = b.dataset.o;
  if (k === 'close') return orClose();
  if (k === 'topic') { OR.topic = b.dataset.t; return orRender(); }
  if (k === 'draw') return orDraw();
  if (k === 'today') { const t = orToday(); if (t) orShow(t.card, t.topic); return; }
  if (k === 'hist') { OR.stage = 'hist'; return orRender(); }
  if (k === 'pick') { OR.stage = 'pick'; OR.again = false; return orRender(); }
  if (k === 'again') { OR.stage = 'pick'; OR.again = true; OR.topic = ''; return orRender(); }
  if (k === 'next') { OR.si = Math.min(OR.si + 1, OR.steps.length - 1); return orRender(); }
  if (k === 'skip') { OR.si = OR.steps.length - 1; return orRender(); }
  if (k === 'more') { OR.more = true; OR.steps = orSteps(OR_CARDS[OR.card], OR.topic, true); OR.si = OR.steps.findIndex(s => s.k === 'view'); return orRender(); }
  if (k === 'save') { const t = orToday(), v = ($('#or-ref') || { value: '' }).value.trim(); if (t) { t.note = v.slice(0, 600); save(); } OR.stage = 'saved'; return orRender(); }
}
function orRender() {
  const m = $('#or-main'); if (!m || !OR) return; const C = OR.card != null ? OR_CARDS[OR.card] : null; let h = '';
  const btn = (o, l, c) => `<button type="button" class="btn ${c || 'accent'}" data-o="${o}">${l}</button>`;
  if (OR.stage === 'pick') {
    const t = orToday(), tn = x => (OR_TOPICS.find(y => y[0] === x) || [0, ''])[1];
    h = t && !OR.again ? `<p class="or-line">Hôm nay bạn đã rút: ${orTodayAll().map(d => `<b>${esc(OR_CARDS[d.card].vn)}</b>${d.topic ? ' (' + esc(tn(d.topic)) + ')' : ''}`).join(', ')}.</p><div class="or-act">${btn('again', 'Rút thêm một lá')}${btn('today', 'Xem lại lá vừa rút', 'soft')}${btn('hist', 'Các lá đã rút', 'soft')}</div><p class="or-hint">Mỗi lá là một góc nhìn. Bạn có thể rút thêm khi muốn nhìn điều gì đó từ một phía khác.</p>`
      : `<p class="or-line">Bạn muốn nhìn điều gì hôm nay?</p><div class="or-topics" role="group" aria-label="Chủ đề">${OR_TOPICS.map(x => `<button type="button" class="chip${OR.topic === x[0] ? ' sel' : ''}" data-o="topic" data-t="${x[0]}" aria-pressed="${OR.topic === x[0]}">${x[1]}</button>`).join('')}</div><p class="or-hint">Chọn một chủ đề, hoặc bỏ qua cũng được. Rồi hít một hơi thật chậm và chọn một lá.</p><div class="or-deck">${[0, 1, 2].map(i => `<button type="button" class="or-back" data-o="draw" aria-label="Lá bài úp ${i + 1}">${nvBack()}</button>`).join('')}</div>${orDraws().length ? `<div class="or-act">${btn('hist', 'Các lá đã rút', 'soft')}</div>` : ''}`;
  } else if (OR.stage === 'hist') {
    const L = orDraws().slice().reverse();
    h = `<p class="or-line">Các lá bạn đã rút</p>${L.length ? '<ul class="or-list">' + L.map(d => `<li><b>${esc(OR_CARDS[d.card] ? OR_CARDS[d.card].vn : '')}</b> <span>${fdate(d.date)}</span>${d.note ? `<em>${esc(d.note)}</em>` : ''}</li>`).join('') + '</ul>' : '<p class="or-hint">Chưa có lá nào.</p>'}<div class="or-act">${btn('pick', 'Quay lại', 'soft')}</div>`;
  } else if (OR.stage === 'saved') {
    h = `<p class="or-line">Đã gửi cho ngày mai. Bạn có thể đọc lại trong “Các lá đã rút”.</p><div class="or-act">${btn('close', 'Đóng')}${btn('hist', 'Các lá đã rút', 'soft')}</div>`;
  } else {
    const s = OR.steps[OR.si], back = `<button type="button" class="or-lk" data-o="pick">← Quay lại</button>`;
    let body = '', act = '';
    const nav = btn('next', 'Tiếp') + btn('skip', 'Bỏ qua', 'soft');
    if (s.k === 'card') { body = orFace(C) + `<p class="or-th">${esc(C.th)}</p>` + (['XIII', 'XV', 'XVI'].includes(C.n) ? '<p class="or-hint">Đây là hình ảnh để suy ngẫm về chuyển hóa, không phải điềm báo. Bạn có thể dừng lại bất cứ lúc nào.</p>' : ''); act = nav; }
    else if (s.k === 'msg') { body = `<p class="or-lab">Thông điệp</p><p class="or-line">${esc(s.t)}</p>`; act = nav; }
    else if (s.k === 'topic') { body = `<p class="or-lab">Về ${esc((OR_TOPICS.find(x => x[0] === s.tp) || [0, ''])[1].toLowerCase())}</p><p class="or-line">${esc(s.t)}</p>`; act = nav; }
    else if (s.k === 'view') { body = `<p class="or-lab">Hai góc nhìn</p><p class="or-line"><b>Bằng trái tim.</b> ${esc(C.sp)}</p><p class="or-line"><b>Bằng thực tế.</b> ${esc(C.re)}</p>`; act = nav; }
    else if (s.k === 'q') { body = `<p class="or-lab">Câu hỏi hôm nay</p><p class="or-line or-q">${esc(s.t)}</p><p class="or-hint">Không cần trả lời ngay. Hãy để câu hỏi ở lại với bạn.</p>`; act = btn('next', 'Tiếp') + btn('next', 'Để lúc khác', 'soft'); }
    else if (s.k === 'act') { body = `<p class="or-lab">Nếu bạn muốn</p><p class="or-line">${esc(s.t)}</p>`; act = nav; }
    else if (s.k === 'note') { body = `<p class="or-lab">Lời nhắn</p><p class="or-line">${esc(s.t)}</p>`; act = btn('next', 'Tiếp'); }
    else { const t = orToday(); body = `<p class="or-lab">Lá bài này chạm đến điều gì trong bạn?</p><textarea id="or-ref" class="or-ta" maxlength="600" rows="3" placeholder="Viết vài dòng, hoặc để trống…">${t ? esc(t.note) : ''}</textarea>`; act = btn('save', 'Gửi cho ngày mai') + (OR.more ? '' : btn('more', 'Xem thêm', 'soft')) + btn('close', 'Để lúc khác', 'soft'); }
    h = `${body}<div class="or-act">${act}</div><div class="or-dots" aria-hidden="true">${OR.steps.map((_, i) => `<i class="${i <= OR.si ? 'on' : ''}"></i>`).join('')}</div>${back}`;
  }
  m.innerHTML = h; const f = m.querySelector('.btn.accent, .or-back, .or-topics .chip'); if (f) f.focus({ preventScroll: true });
}
ACT.oracle = () => { orOpen(); if (orToday()) { OR.again = true; orRender(); } };

/* mặt sau lá bài kiểu Art Nouveau, dùng chung cho phòng và hộp rút bài */
const nvBack = (w) => `<svg viewBox="0 0 100 160" aria-hidden="true"${w ? ` width="${w}" height="${w * 1.6}"` : ''}><rect x="1" y="1" width="98" height="158" rx="7" fill="#17172D" stroke="#C5A979" stroke-width="1.4"/><rect x="5" y="5" width="90" height="150" rx="5" fill="#35334F" opacity=".5" stroke="#C5A979" stroke-width=".5"/>
  <path d="M50,22 C70,22 82,40 82,62 V138 H18 V62 C18,40 30,22 50,22Z" fill="none" stroke="#C5A979" stroke-width=".8" opacity=".85"/>
  <circle cx="50" cy="80" r="22" fill="none" stroke="#C5A979" stroke-width=".9"/><circle cx="50" cy="80" r="17" fill="none" stroke="#C5A979" stroke-width=".4" opacity=".8"/>
  <path d="M50,58 Q52,78 72,80 Q52,82 50,102 Q48,82 28,80 Q48,78 50,58Z" fill="#E8DDC8" opacity=".92"/><path d="M44,40 a7,7 0 1 0 9,9 a5.5,5.5 0 1 1 -9,-9Z" fill="#C5A979"/>
  <path d="M50,112 V130 M44,121 H56" stroke="#C5A979" stroke-width=".7"/><circle cx="50" cy="134" r="1.6" fill="#C5A979"/>
  ${[[10, 10], [90, 10], [10, 150], [90, 150]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="1.8" fill="#C5A979"/>`).join('')}</svg>`;
Art.oracleRoom = function () {
  const stars = Array.from({ length: 40 }, (_, i) => { const r = rnd(i + 700); return `<circle cx="${(250 + r() * 300).toFixed(0)}" cy="${(40 + r() * 170).toFixed(0)}" r="${(.6 + r() * 1.2).toFixed(1)}" fill="#E8DDC8" opacity="${(.3 + r() * .6).toFixed(2)}" class="twinkle" style="animation-delay:${(r() * 4).toFixed(1)}s"/>`; }).join('');
  const card = (x, y, r, i) => `<g class="orr-card" data-act="oracle" tabindex="0" role="button" aria-label="Lá bài úp ${i + 1}: chạm để rút" transform="translate(${x},${y}) rotate(${r})"><g class="orr-lift"><rect x="-38" y="-58" width="76" height="120" rx="6" fill="#05030f" opacity=".35" transform="translate(4,6)"/><g transform="translate(-38,-61) scale(.76)">${nvBack(100)}</g></g></g>`;
  const candle = (x, y, h) => `<circle cx="${x}" cy="${y - h - 8}" r="30" fill="url(#orrGl)"/><rect x="${x - 6}" y="${y - h}" width="12" height="${h}" rx="2" fill="#E8DDC8"/><path d="M${x - 6},${y - h} Q${x},${y - h + 3} ${x + 6},${y - h}" stroke="#bfb29a" stroke-width="1" fill="none"/><path d="M${x},${y - h - 2} Q${x - 5},${y - h - 10} ${x},${y - h - 19} Q${x + 5},${y - h - 10} ${x},${y - h - 2}Z" fill="#f4d9a0" class="flicker"/><path d="M${x},${y - h - 4} Q${x - 2},${y - h - 9} ${x},${y - h - 13} Q${x + 2},${y - h - 9} ${x},${y - h - 4}Z" fill="#fff6e0"/>`;
  return `<svg viewBox="0 0 800 420" role="group" aria-label="Điện Vận Mệnh: ba lá bài úp trên bàn nhung dưới khung cửa sổ trăng">
    <defs><linearGradient id="orrWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c1b34"/><stop offset="1" stop-color="#2a2744"/></linearGradient>
      <linearGradient id="orrSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#17172D"/><stop offset="1" stop-color="#4a4466"/></linearGradient>
      <linearGradient id="orrCloth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3e2a44"/><stop offset="1" stop-color="#1e1426"/></linearGradient>
      <radialGradient id="orrGl"><stop offset="0" stop-color="#f4d9a0" stop-opacity=".5"/><stop offset="1" stop-color="#f4d9a0" stop-opacity="0"/></radialGradient>
      <radialGradient id="orrMoon"><stop offset="0" stop-color="#f2ead8" stop-opacity=".5"/><stop offset="1" stop-color="#f2ead8" stop-opacity="0"/></radialGradient></defs>
    <rect width="800" height="420" fill="url(#orrWall)"/>
    ${Array.from({ length: 9 }, (_, i) => `<path d="M${i * 100},0 V420" stroke="#C5A979" stroke-width=".5" opacity=".12"/>`).join('')}
    <path d="M250,250 V110 C250,40 330,20 400,18 C470,20 550,40 550,110 V250Z" fill="url(#orrSky)"/>${stars}
    <circle cx="470" cy="92" r="70" fill="url(#orrMoon)"/><circle cx="470" cy="92" r="26" fill="#efe6d4"/><circle cx="480" cy="86" r="22" fill="#35334F" opacity=".5"/>
    <path d="M250,250 V110 C250,40 330,20 400,18 C470,20 550,40 550,110 V250" fill="none" stroke="#C5A979" stroke-width="3"/><path d="M400,18 V250 M250,140 H550" stroke="#C5A979" stroke-width="1.6" opacity=".8"/><path d="M240,256 V108 C240,32 326,10 400,8 C474,10 560,32 560,108 V256" fill="none" stroke="#C5A979" stroke-width=".8" opacity=".6"/>
    ${[[160, 70], [640, 70]].map(([x, y]) => `<g transform="translate(${x},${y})" opacity=".55"><path d="M0,-26 Q3,-3 26,0 Q3,3 0,26 Q-3,3 -26,0 Q-3,-3 0,-26Z" fill="#C5A979"/><circle r="34" fill="none" stroke="#C5A979" stroke-width=".8"/></g>`).join('')}
    <path d="M60,270 Q400,240 740,270 L760,420 H40Z" fill="url(#orrCloth)"/><path d="M60,270 Q400,240 740,270" stroke="#C5A979" stroke-width="2" fill="none"/><path d="M52,300 Q400,272 748,300" stroke="#C5A979" stroke-width=".8" fill="none" opacity=".6" stroke-dasharray="2 6"/>
    ${candle(130, 300, 46)}${candle(670, 300, 58)}${candle(706, 306, 34)}
    <g opacity=".85"><circle cx="196" cy="318" r="14" fill="#C5A979" opacity=".2"/><path d="M186,322 C186,306 206,306 206,322Z" fill="#9ab8d8" opacity=".5"/><circle cx="196" cy="312" r="10" fill="#bcd4ec" opacity=".55"/><circle cx="192" cy="308" r="3" fill="#fff" opacity=".8"/><path d="M184,326 H208 L204,320 H188Z" fill="#C5A979"/></g>
    ${card(310, 330, -9, 0)}${card(400, 322, 0, 1)}${card(490, 330, 9, 2)}
    ${[[586, 352], [606, 340], [226, 360]].map(([x, y]) => `<path d="M${x},${y} q4,-8 8,0 q-4,6 -8,0Z" fill="#b9837d" opacity=".7"/>`).join('')}
  </svg>`;
};
STORY.oracle = {
  open: [['Căn phòng này không đoán trước tương lai.', 'Nó chỉ đưa cho bạn một hình ảnh, để bạn nhìn lại điều đang ở trong lòng mình.'],
         ['Ánh nến ở đây không vội.', 'Bạn cũng không cần vội.', 'Hít một hơi thật chậm, rồi chọn lá nào bạn thấy muốn chạm vào.'],
         ['Mỗi lá bài là một tấm gương nhỏ.', 'Điều bạn thấy trong đó, phần lớn là điều bạn đã biết từ lâu.']],
  guide: ['Chạm vào một lá bài úp trên bàn để rút. Bạn có thể chọn chủ đề trước, hoặc bỏ qua.', 'Muốn nhìn từ một góc khác? Bạn có thể rút thêm lá trong cùng một ngày.'],
  ask: ['Hôm nay bạn đang mang theo câu hỏi nào?', 'Điều gì bạn muốn được nhìn rõ hơn một chút?']
};
RENDER.oracle = () => {
  const today = orDraws().filter(d => d.date === ymd()), n = orDraws().length;
  const list = today.length ? `<p class="orr-today">Hôm nay bạn đã rút: ${today.map(d => `<b>${esc(OR_CARDS[d.card] ? OR_CARDS[d.card].vn : '')}</b>`).join(', ')}.</p>` : '';
  return { scene: Art.oracleRoom(), body: `<div class="orr-body">${list}<div class="orr-act"><button type="button" class="btn accent" data-act="oracle">${today.length ? 'Rút thêm một lá' : 'Rút lá bài hôm nay'}</button>${today.length ? '<button type="button" class="btn" data-act="oracle_today">Xem lại lá vừa rút</button>' : ''}${n ? '<button type="button" class="btn" data-act="oracle_hist">Các lá đã rút</button>' : ''}</div><p class="hint">Lá bài là hình ảnh để suy ngẫm, không phải lời tiên đoán.</p></div>` };
};
ACT.oracle_today = () => { orOpen(); const t = orToday(); if (t) orShow(t.card, t.topic); };
ACT.oracle_hist = () => { orOpen(); OR.stage = 'hist'; orRender(); };

/* điện thoại cầm dọc: gợi ý xoay ngang, và thử tự khoá màn hình ngang (chỉ chạy được khi trình duyệt cho phép toàn màn hình) */
(function () {
  const portrait = () => matchMedia('(max-width:700px) and (orientation:portrait)').matches;
  let off = false; try { off = sessionStorage.getItem('soulHaven.rot') === '1'; } catch (e) {}
  const el = document.createElement('div'); el.id = 'rot-hint'; el.hidden = true; el.setAttribute('role', 'note');
  el.innerHTML = '<span>Xoay ngang điện thoại để xem rộng và rõ hơn</span><button type="button" aria-label="Ẩn gợi ý">×</button>'; document.body.appendChild(el);
  let hideT; const upd = () => { clearTimeout(hideT); el.hidden = off || !portrait(); if (!el.hidden) hideT = setTimeout(() => { el.hidden = true; }, 9000); };
  el.querySelector('button').addEventListener('click', () => { off = true; try { sessionStorage.setItem('soulHaven.rot', '1'); } catch (e) {} upd(); });
  addEventListener('resize', upd); addEventListener('orientationchange', upd); try { matchMedia('(orientation:portrait)').addEventListener('change', upd); } catch (e) {} upd();
  let tried = false;
  document.addEventListener('pointerup', () => {
    if (tried || !portrait()) return; tried = true;
    try { const p = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); if (p && p.then) p.then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape')).catch(() => {}); } catch (e) {}
  }, { passive: true });
})();
/* --- Nghe đọc: giọng tiếng Việt có sẵn của máy, hoặc Vbee qua máy chủ riêng của bạn (khóa Vbee chỉ nằm trên máy chủ, không bao giờ trong app) --- */
(function () {
  const KEY = 'soulHaven.tts'; let cfg = { mode: 'browser', url: '', voice: '' };
  try { Object.assign(cfg, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
  const saveCfg = () => { try { localStorage.setItem(KEY, JSON.stringify(cfg)); } catch (e) {} };
  const hasSS = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
  let audio = null, speaking = false, reqId = 0;
  const btn = document.createElement('button'); btn.type = 'button'; btn.id = 'tts-btn'; btn.setAttribute('aria-label', 'Nghe đọc nội dung màn hình này');
  btn.innerHTML = '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4,9 H8 L13,5 V19 L8,15 H4Z" fill="currentColor"/><path d="M16,8.5 C18,10.5 18,13.5 16,15.5 M18.6,6 C22,9.4 22,14.6 18.6,18" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg><span>Nghe</span>';
  const gear = document.createElement('button'); gear.type = 'button'; gear.id = 'tts-gear'; gear.setAttribute('aria-label', 'Cài đặt giọng đọc'); gear.textContent = '⚙';
  const pn = document.createElement('div'); pn.id = 'tts-pn'; pn.hidden = true;
  pn.innerHTML = '<b>Giọng đọc</b><label><input type="radio" name="tts-m" value="browser"> Giọng tiếng Việt của máy</label><label><input type="radio" name="tts-m" value="vbee"> Vbee (qua máy chủ riêng)</label><div id="tts-vb"><input type="url" id="tts-url" placeholder="Địa chỉ máy chủ trung gian của bạn" autocomplete="off"><input type="text" id="tts-voice" placeholder="Mã giọng Vbee (tùy chọn)" autocomplete="off"><p>Dán địa chỉ máy chủ Render (vd https://ten-app.onrender.com). Token Vbee chỉ nằm trên máy chủ, đừng dán vào đây. Khi đã chọn Vbee, nếu lỗi app sẽ báo nguyên nhân chứ không tự đổi sang giọng của máy.</p></div><div class="tts-row"><button type="button" id="tts-save">Lưu</button><button type="button" id="tts-check">Kiểm tra giọng</button><button type="button" id="tts-test">Nghe thử</button></div>';
  document.body.append(btn, gear, pn);
  const sync = () => { pn.querySelectorAll('[name=tts-m]').forEach(r => { r.checked = r.value === cfg.mode; }); pn.querySelector('#tts-vb').hidden = cfg.mode !== 'vbee'; pn.querySelector('#tts-url').value = cfg.url || ''; pn.querySelector('#tts-voice').value = cfg.voice || ''; };
  const vis = el => el && el.offsetParent !== null || (el && getComputedStyle(el).position === 'fixed');
  function pageText() {
    const ov = ['#gr', '#or', '#med'].map(s => document.querySelector(s)).find(e => e && vis(e));
    const root = ov || document.getElementById('app'); if (!root) return '';
    let parts = [...root.querySelectorAll(ov ? '.or-line,.or-q,.or-th,.gr-line,.md-ui h2,.md-line,.md-say,p' : '.care-say,.care-why p,.al-ask .al-asksay,.al-ask>div>b,.al-hudsay,.lt-say,.guide-text p,.st-text,.wp,.intro p,.fox-bubble:not([hidden])')].filter(e => e.offsetParent !== null || ov).map(e => e.innerText.trim()).filter(t => t.length > 3);
    if (!parts.length) parts = root.innerText.split(/\n+/).map(s => s.trim()).filter(s => s.length >= 24);
    return [...new Set(parts)].map(s => /[.!?…:]$/.test(s) ? s : s + '.').join(' ').replace(/\s+/g, ' ').slice(0, 900);
  }
  const chunks = t => (t.match(/[^.!?…]+[.!?…]*/g) || [t]).reduce((a, s) => { s = s.trim(); if (!s) return a; if (a.length && (a[a.length - 1] + ' ' + s).length < 170) a[a.length - 1] += ' ' + s; else a.push(s); return a; }, []);
  function setState(on) { speaking = on; btn.classList.toggle('on', on); btn.querySelector('span').textContent = on ? 'Dừng' : 'Nghe'; }
  function stop() { reqId++; if (hasSS) speechSynthesis.cancel(); if (audio) { try { audio.pause(); } catch (e) {} audio = null; } setState(false); }
  function speakBrowser(text, id) {
    if (!hasSS) { toast('Trình duyệt này chưa hỗ trợ đọc thành tiếng.', false); setState(false); return; }
    const vs = speechSynthesis.getVoices(), v = vs.find(x => /^vi/i.test(x.lang)); if (!v && vs.length) toast('Máy chưa có giọng tiếng Việt, mình thử đọc bằng giọng mặc định.', false);
    const cs = chunks(text); let i = 0;
    const next = () => { if (id !== reqId) return; if (i >= cs.length) { setState(false); return; } const u = new SpeechSynthesisUtterance(cs[i++]); u.lang = 'vi-VN'; if (v) u.voice = v; u.rate = .92; u.onend = next; u.onerror = () => { if (id === reqId) setState(false); }; speechSynthesis.speak(u); };
    next();
  }
  /* Khi app được máy chủ Render phục vụ, máy chủ tự gắn SOULHAVEN_TTS_BASE: không cần nhập địa chỉ. Trong Claude Artifact thì phải nhập (và có thể bị chặn). */
  const defBase = () => (typeof window.SOULHAVEN_TTS_BASE === 'string' ? location.origin : '');
  const base = () => (cfg.url || defBase()).replace(/\/+$/, '').replace(/\/api\/tts$/, '');
  const failVbee = (id, msg) => { if (id === reqId) { setState(false); toast(msg, false); } };
  /* Khi đã chọn Vbee: KHÔNG tự chuyển sang giọng trình duyệt; mọi lỗi đều hiện đúng nguyên nhân. */
  async function speakVbee(text, id) {
    let r;
    try { r = await fetch(base() + '/api/tts', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: text.slice(0, 3000), voice: cfg.voice }) }); }
    catch (e) { return failVbee(id, 'Không kết nối được máy chủ Vbee (' + base() + '). Kiểm tra địa chỉ, máy chủ Render đang chạy, hoặc app bị chặn kết nối ngoài.'); }
    if (!r.ok) {
      let j = null; try { j = await r.json(); } catch (e) {}
      const er = j && j.error, T = { auth: 'Lỗi xác thực Vbee', voice: 'Lỗi mã giọng', credit: 'Vbee hết credit', config: 'Máy chủ chưa cấu hình', network: 'Máy chủ không tới được Vbee', busy: 'Vbee đang bận', timeout: 'Vbee quá lâu' };
      return failVbee(id, er ? er.message : 'Lỗi máy chủ Vbee (HTTP ' + r.status + ').');
    }
    let src; try { src = URL.createObjectURL(await r.blob()); } catch (e) { return failVbee(id, 'Lỗi nhận âm thanh từ máy chủ.'); }
    if (id !== reqId) return;
    audio = new Audio(src); audio.onended = () => { if (id === reqId) setState(false); };
    audio.onerror = () => failVbee(id, 'Lỗi phát âm thanh: trình duyệt không phát được file Vbee trả về.');
    try { await audio.play(); } catch (e) { failVbee(id, 'Lỗi phát âm thanh: ' + (e && e.name === 'NotAllowedError' ? 'trình duyệt chặn tự phát, hãy bấm Nghe lại.' : 'không phát được.')); }
  }
  function speak(text) {
    stop(); if (!text) { toast('Màn hình này chưa có nội dung để đọc.', false); return; }
    if (cfg.mode === 'vbee') {
      if (!base()) { toast('Chưa kết nối máy chủ Vbee', false); return; }
      if (!cfg.voice) { toast('Lỗi mã giọng: chưa nhập mã giọng Vbee.', false); return; }
      const id = ++reqId; setState(true); speakVbee(text, id); return;
    }
    const id = ++reqId; setState(true); speakBrowser(text, id);
  }
  async function checkVoice() {
    const url = pn.querySelector('#tts-url').value.trim() || defBase(), v = pn.querySelector('#tts-voice').value.trim();
    if (!url) { toast('Chưa kết nối máy chủ Vbee', false); return; } if (!v) { toast('Hãy nhập mã giọng để kiểm tra.', false); return; }
    try { const r = await fetch(url.replace(/\/+$/, '').replace(/\/api\/tts$/, '') + '/api/voices?code=' + encodeURIComponent(v)); const j = await r.json();
      toast(j.supported ? 'Mã giọng hợp lệ: ' + (j.voice && j.voice.name || v) : (j.error ? j.error.message : 'Không kiểm tra được mã giọng.'), !!j.supported);
    } catch (e) { toast('Không kết nối được máy chủ Vbee.', false); }
  }
  btn.addEventListener('click', () => { if (speaking) stop(); else speak(pageText()); });
  gear.addEventListener('click', () => { pn.hidden = !pn.hidden; if (!pn.hidden) sync(); });
  pn.addEventListener('change', e => { if (e.target.name === 'tts-m') { cfg.mode = e.target.value; pn.querySelector('#tts-vb').hidden = cfg.mode !== 'vbee'; } });
  pn.querySelector('#tts-save').addEventListener('click', () => { cfg.url = pn.querySelector('#tts-url').value.trim(); cfg.voice = pn.querySelector('#tts-voice').value.trim(); saveCfg(); pn.hidden = true; toast('Đã lưu cài đặt giọng đọc.', true); });
  pn.querySelector('#tts-check').addEventListener('click', checkVoice);
  pn.querySelector('#tts-test').addEventListener('click', () => { cfg.url = pn.querySelector('#tts-url').value.trim(); cfg.voice = pn.querySelector('#tts-voice').value.trim(); speak('Chào bạn, mình là Đóm. Mình sẽ đọc cho bạn nghe.'); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) stop(); });
  if (hasSS) try { speechSynthesis.getVoices(); } catch (e) {}
})();
render();
</script>
